name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# The Release step publishes a GitHub release, which needs write access to repo contents
permissions:
  contents: write

env:
  VERSION: 1.0.6
  BUILD_CONFIGURATION: Release
  SERVER_NAME: ${{ vars.SERVER_NAME == '' && 'EQEmu Patcher' || vars.SERVER_NAME }}
  FILE_NAME: ${{ vars.FILE_NAME == '' && 'eqemupatcher' || vars.FILE_NAME }}
  FILELIST_URL: ${{ vars.FILELIST_URL == '' && format('https://github.com/{0}/releases/latest/download/', github.repository) || vars.FILELIST_URL }}
  PATCHER_URL: ${{ vars.PATCHER_URL == '' && format('https://github.com/{0}/releases/latest/download/', github.repository) || vars.PATCHER_URL }}
  STORAGE_URL: ${{ vars.STORAGE_URL == '' && format('https://raw.githubusercontent.com/{0}/master/rof/', github.repository) || vars.STORAGE_URL }}
  TOB_STORAGE_URL: ${{ vars.TOB_STORAGE_URL == '' && format('https://raw.githubusercontent.com/{0}/master/tob/', github.repository) || vars.TOB_STORAGE_URL }}
  # Second patcher built from the same code for the Profusion server
  PROFUSION_SERVER_NAME: ${{ vars.PROFUSION_SERVER_NAME == '' && 'Profusion EQ' || vars.PROFUSION_SERVER_NAME }}
  PROFUSION_FILE_NAME: ${{ vars.PROFUSION_FILE_NAME == '' && 'EQ_Profusion_Patcher' || vars.PROFUSION_FILE_NAME }}
  PROFUSION_URL: ${{ vars.PROFUSION_URL == '' && 'http://downloads.ascendanteq.com/profusionpatch/' || vars.PROFUSION_URL }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1.3

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cd "EQEmu Patcher" && nuget restore "EQEmu Patcher.sln"

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cd "EQEmu Patcher" && msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:VERSION="${{ env.VERSION }}.${{ github.run_number }}" /p:FILELIST_URL=${{env.FILELIST_URL}} /p:SERVER_NAME="${{env.SERVER_NAME}}" /p:FILE_NAME="${{env.FILE_NAME}}" "EQEmu Patcher.sln"

    - name: Generate filelist
      run: |
        cd "rof"
        C:\msys64\usr\bin\wget.exe --no-verbose https://github.com/xackery/filelistbuilder/releases/latest/download/filelistbuilder-win-x64.exe
        .\filelistbuilder-win-x64.exe "rof" "${{env.STORAGE_URL}}" "../EQEmu Patcher/EQEmu Patcher/bin/Release/eqemupatcher.exe"
        move "../EQEmu Patcher/EQEmu Patcher/bin/Release/eqemupatcher.exe" "../EQEmu Patcher/EQEmu Patcher/bin/Release/${{env.FILE_NAME}}.exe"
        move eqemupatcher-hash.txt ${{env.FILE_NAME}}-hash.txt

    - name: Generate ToB filelist
      run: |
        cd "tob"
        ..\rof\filelistbuilder-win-x64.exe "tob" "${{env.TOB_STORAGE_URL}}"

    - name: Build Profusion patcher
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cd "EQEmu Patcher"
        msbuild /m /t:Rebuild /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:VERSION="${{ env.VERSION }}.${{ github.run_number }}" /p:FILELIST_URL=${{env.PROFUSION_URL}} /p:PATCHER_URL=${{env.PROFUSION_URL}} /p:SERVER_NAME="${{env.PROFUSION_SERVER_NAME}}" /p:FILE_NAME="${{env.PROFUSION_FILE_NAME}}" "EQEmu Patcher.sln"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $exe = "EQEmu Patcher/bin/Release/${{env.PROFUSION_FILE_NAME}}.exe"
        Move-Item "EQEmu Patcher/bin/Release/eqemupatcher.exe" $exe
        # Self-update compares this against the exe's own uppercase MD5
        (Get-FileHash -Algorithm MD5 $exe).Hash | Set-Content -NoNewline -Encoding ascii "../${{env.PROFUSION_FILE_NAME}}-hash.txt"

    - name: Release
      uses: "marvinpinto/action-automatic-releases@latest"
      if: github.ref == 'refs/heads/master'
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "${{ env.VERSION }}.${{ github.run_number }}"
        prerelease: false
        title: "${{ env.VERSION }}.${{ github.run_number }}"
        files: |
          EQEmu Patcher/EQEmu Patcher/bin/Release/${{env.FILE_NAME}}.exe
          rof/filelist_rof.yml
          tob/filelist_tob.yml
          rof/${{env.FILE_NAME}}-hash.txt
          EQEmu Patcher/EQEmu Patcher/bin/Release/${{env.PROFUSION_FILE_NAME}}.exe
          ${{env.PROFUSION_FILE_NAME}}-hash.txt
