# Host this file at FILELIST_URL (e.g. http://downloads.ascendanteq.com/ascendantpatch/clients.yml).
# It adds clients without rebuilding the patcher. RoF2 and ToB are still detected by the hashes built
# into the patcher; this list is only checked when eqgame.exe matches none of those.
#
# name:      shown in the patcher's title bar
# folder:    the client folder on the server; the patcher fetches <folder>/filelist_<folder>.yml
#            (lowercase letters, digits, - and _ only)
# hashes:    every eqgame.exe MD5 the patcher should recognise for this folder. Keep old builds listed:
#            players still on them are recognised and brought up to date.
# supported: optional. The build the server speaks now. A player on it has LaunchPad.exe disabled so their
#            client can't update past it; a player on an older listed build is sent through LaunchPad once
#            to update. Change it when the server is ready for a new live build.
#
# tools/Update-Clients.ps1 hashes a new eqgame.exe and adds it (with -Supported, also sets supported).
clients:
  - name: Live
    folder: live
    supported: 18CF8F8352A6E04B7CFED734F6506B31 # eqgame.exe dated 2026-09-17
    hashes:
      - 18CF8F8352A6E04B7CFED734F6506B31 # eqgame.exe dated 2026-09-17
